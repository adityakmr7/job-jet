name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # apps/web runs `next typegen` before tsc
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension (production mode, placeholder config)
        env:
          # Placeholder only (no secrets are needed to build the extension).
          VITE_API_BASE_URL: https://jobjet.example.com
        run: npm run build:extension

      - name: Build web
        # Runtime secrets are read lazily, so the build needs no real env.
        run: npm run build:web
